name: CPU-only structural checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cpu-structural-tests-no-cuda-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run CPU-only repository checks
        run: python -m unittest discover -s tests -v
